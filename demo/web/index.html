<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Plunder Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%B4%E2%80%8D%E2%98%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161a22;
    --line: #262c38;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --accent: #f2c14e;
    --ok: #4cc38a;
    --warn: #f2c14e;
    --bad: #ef5d5d;
    --btn: #222834;
    --btn-press: #3a4356;
    --a: #e5534b; --b: #e9b949; --x: #4f8ff7; --y: #47b87a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  header h1 { white-space: nowrap; font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; min-width: 0; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-state="ok"] .dot { background: var(--ok); }
  .status[data-state="building"] .dot, .status[data-state="starting"] .dot { background: var(--warn); animation: pulse 1s infinite; }
  .status[data-state="failed"] .dot, .status[data-state="offline"] .dot { background: var(--bad); }
  .status #statusText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes pulse { 50% { opacity: .3; } }
  header .spacer { flex: 1; }
  header a, header button { color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 9px; font: inherit; font-size: 12.5px; text-decoration: none; cursor: pointer; white-space: nowrap; }
  header a:hover, header button:hover { color: var(--text); border-color: var(--muted); }
  header button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  #logPanel { width: min(560px, 42vw); flex: none; display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid var(--line); background: var(--panel); }
  #logPanel[hidden] { display: none; }
  .log-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .log-head .spacer { flex: 1; }
  .log-tabs { display: flex; gap: 4px; }
  .log-tabs button, #logClose, #logRaw { color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 9px; font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: none; }
  .log-tabs button[aria-selected="true"] { color: var(--text); background: var(--btn); border-color: var(--muted); }
  .log-tabs button:hover, #logClose:hover, #logRaw:hover { color: var(--text); }
  .log-meta { color: var(--muted); font-size: 12px; }
  .log-follow { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #logBody { flex: 1; min-height: 0; margin: 0; padding: 10px 12px; overflow: auto; background: var(--bg);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #c9cfdb; white-space: pre-wrap; word-break: break-word; }
  #logBody .err { color: var(--bad); }
  #logBody .warn { color: var(--warn); }
  #logBody .dim { color: var(--muted); }
  @media (max-width: 900px) {
    #logPanel { position: fixed; inset: 0; top: auto; height: 70vh; width: auto; z-index: 10;
      border-left: none; border-top: 1px solid var(--line); box-shadow: 0 -12px 40px rgba(0,0,0,.5); }
    .log-meta { display: none; }
    .log-head { flex-wrap: nowrap; }
  }

  .workspace { flex: 1; min-height: 0; display: flex; }
  main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px; }
  #screenWrap { position: relative; flex: 1 1 0; min-height: 180px; width: 100%; max-width: 1280px; background: #000;
    border-radius: 10px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  #screen { position: absolute; inset: 0; }
  #screen canvas { outline: none; }
  #overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
    background: rgba(13,15,20,.82); color: var(--muted); font-size: 14px; }
  #overlay[hidden] { display: none; }

  .pad { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 560px; gap: 16px; user-select: none; touch-action: none; }
  .cluster { position: relative; width: 150px; height: 150px; flex: none; }
  .shoulders { display: flex; justify-content: space-between; width: 100%; max-width: 560px; gap: 16px; }
  .pad button, .shoulders button { position: absolute; border: 1px solid var(--line); background: var(--btn); color: var(--text);
    font: 600 16px system-ui, sans-serif; display: grid; place-items: center; touch-action: none; cursor: pointer; }
  .pad button.pressed, .shoulders button.pressed { background: var(--btn-press); transform: scale(.94); }
  .shoulders button { position: static; width: 96px; height: 38px; border-radius: 10px; font-size: 14px; }
  .dpad button { width: 50px; height: 50px; border-radius: 8px; }
  .dpad .up { left: 50px; top: 0; } .dpad .down { left: 50px; top: 100px; }
  .dpad .left { left: 0; top: 50px; } .dpad .right { left: 100px; top: 50px; }
  .dpad .hub { left: 50px; top: 50px; width: 50px; height: 50px; background: var(--btn); border: 1px solid var(--line); position: absolute; pointer-events: none; }
  .face button { width: 54px; height: 54px; border-radius: 50%; font-size: 17px; }
  .face .x { left: 48px; top: 0; color: var(--x); } .face .b { left: 48px; top: 96px; color: var(--b); }
  .face .y { left: 0; top: 48px; color: var(--y); } .face .a { left: 96px; top: 48px; color: var(--a); }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; flex: none; }
  @media (orientation: portrait) { #screenWrap { flex: none; aspect-ratio: 16 / 9; min-height: 0; } }
  .hint { color: var(--muted); font-size: 12.5px; text-align: center; max-width: 720px; }
  kbd { font: 11.5px ui-monospace, monospace; background: var(--btn); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--text); }

  /* Desktop: keyboard is the main input; keep the pad compact under the screen. */
  @media (hover: hover) and (pointer: fine) {
    .controls .pad, .controls .shoulders { display: none; }
    body.show-pad .controls .pad, body.show-pad .controls .shoulders { display: flex; }
  }
  @media (hover: none), (pointer: coarse) { .hint.kbd, #padToggle { display: none; } }
  @media (max-width: 600px) {
    header { flex-wrap: wrap; row-gap: 6px; }
    header .status { order: 5; flex-basis: 100%; }
  }

  /* Phone landscape: handheld layout, D-pad | screen | face buttons. */
  @media (orientation: landscape) and (max-height: 560px) {
    header { padding: 4px 12px; }
    header .opt { display: none; }
    main { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: 1fr; align-items: center; padding: 6px 10px; gap: 10px; }
    #screenWrap { grid-column: 2; grid-row: 1; height: 100%; width: 100%; min-height: 0; }
    .cluster { margin-top: 40px; }
    .controls { display: contents; }
    .controls .hint { display: none; }
    .shoulders { display: none; }
    .pad { display: contents; }
    .pad .cluster.dpad { grid-column: 1; grid-row: 1; }
    .pad .cluster.face { grid-column: 3; grid-row: 1; }
    main .pad .side-shoulder { display: grid; }
  }
  .pad .side-shoulder { display: none; position: absolute; top: -52px; width: 96px; height: 34px; border-radius: 10px; }
  .dpad .side-shoulder { left: 27px; } .face .side-shoulder { left: 27px; }
</style>
</head>
<body>
<header>
  <h1>🏴‍☠️ <span>Plunder</span> demo</h1>
  <div class="status" id="status" data-state="starting"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  <div class="spacer"></div>
  <button class="opt" id="padToggle" type="button">Show pad</button>
  <button class="opt" data-log="build" type="button" aria-pressed="false">Build log</button>
  <button class="opt" data-log="app" type="button" aria-pressed="false">App log</button>
  <button id="fsBtn" type="button">Fullscreen</button>
</header>

<div class="workspace">
<main>
  <div id="screenWrap">
    <div id="screen"></div>
    <div id="overlay">Connecting to the demo…</div>
  </div>

  <div class="controls">
    <div class="shoulders">
      <button data-key="q" type="button">L</button>
      <button data-key="e" type="button">R</button>
    </div>
    <div class="pad">
      <div class="cluster dpad">
        <button class="side-shoulder" data-key="q" type="button">L</button>
        <span class="hub"></span>
        <button class="up" data-key="Up" data-repeat type="button" aria-label="Up">▲</button>
        <button class="left" data-key="Left" data-repeat type="button" aria-label="Left">◀</button>
        <button class="right" data-key="Right" data-repeat type="button" aria-label="Right">▶</button>
        <button class="down" data-key="Down" data-repeat type="button" aria-label="Down">▼</button>
      </div>
      <div class="cluster face">
        <button class="side-shoulder" data-key="e" type="button">R</button>
        <button class="x" data-key="x" type="button">X</button>
        <button class="y" data-key="y" type="button">Y</button>
        <button class="a" data-key="Return" type="button">A</button>
        <button class="b" data-key="BackSpace" type="button">B</button>
      </div>
    </div>
    <p class="hint kbd">Click the screen, then use the keyboard:
      <kbd>↑↓←→</kbd> move · <kbd>Enter</kbd> A · <kbd>Backspace</kbd>/<kbd>Esc</kbd> B ·
      <kbd>X</kbd> X · <kbd>Y</kbd> Y (filter) · <kbd>Q</kbd>/<kbd>E</kbd> L/R</p>
    <p class="hint">Rebuilds automatically when the repo's <kbd>src/</kbd>, <kbd>res/</kbd> or <kbd>Makefile</kbd> change.</p>
  </div>
</main>

<aside id="logPanel" hidden aria-label="Log viewer">
  <div class="log-head">
    <div class="log-tabs" role="tablist">
      <button type="button" role="tab" data-tab="build">Build log</button>
      <button type="button" role="tab" data-tab="app">App log</button>
    </div>
    <span class="log-meta" id="logMeta"></span>
    <div class="spacer"></div>
    <label class="log-follow"><input type="checkbox" id="logFollow" checked> Follow</label>
    <a id="logRaw" href="logs/build.log" target="_blank" rel="noopener">Raw</a>
    <button type="button" id="logClose" aria-label="Close log">✕</button>
  </div>
  <pre id="logBody" tabindex="0"></pre>
</aside>
</div>

<script type="module">
import RFB from './core/rfb.js';

const KEYSYM = { Up: 0xff52, Down: 0xff54, Left: 0xff51, Right: 0xff53,
                 Return: 0xff0d, BackSpace: 0xff08, x: 0x78, y: 0x79, q: 0x71, e: 0x65 };
const CODE = { Up: 'ArrowUp', Down: 'ArrowDown', Left: 'ArrowLeft', Right: 'ArrowRight',
               Return: 'Enter', BackSpace: 'Backspace', x: 'KeyX', y: 'KeyY', q: 'KeyQ', e: 'KeyE' };

const screenEl = document.getElementById('screen');
const overlay = document.getElementById('overlay');
let rfb = null, retry = null;

function connect() {
  clearTimeout(retry);
  const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/websockify`;
  rfb = new RFB(screenEl, url, { shared: true });
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.background = '#000';
  rfb.addEventListener('connect', () => { overlay.hidden = true; });
  rfb.addEventListener('disconnect', () => {
    overlay.hidden = false;
    overlay.textContent = 'Disconnected. Reconnecting…';
    retry = setTimeout(connect, 2000);
  });
}
connect();

// --- on-screen gamepad ---------------------------------------------------------
function send(name, down) { if (rfb) rfb.sendKey(KEYSYM[name], CODE[name], down); }
document.querySelectorAll('[data-key]').forEach((btn) => {
  const name = btn.dataset.key;
  let delay = null, repeat = null;
  const release = () => {
    if (!btn.classList.contains('pressed')) return;
    btn.classList.remove('pressed');
    clearTimeout(delay); clearInterval(repeat);
    send(name, false);
  };
  btn.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    btn.setPointerCapture?.(ev.pointerId);
    btn.classList.add('pressed');
    send(name, true);
    if (btn.hasAttribute('data-repeat')) {
      delay = setTimeout(() => { repeat = setInterval(() => send(name, true), 90); }, 380);
    }
    navigator.vibrate?.(8);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((t) => btn.addEventListener(t, release));
  btn.addEventListener('contextmenu', (ev) => ev.preventDefault());
});

// --- build status --------------------------------------------------------------
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
let lastBuild = null;
function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`;
}
async function poll() {
  try {
    const r = await fetch('status.json', { cache: 'no-store' });
    const s = await r.json();
    statusEl.dataset.state = s.state;
    const label = { ok: 'Build', building: 'Building', failed: 'Build failed', starting: 'Starting' }[s.state] || s.state;
    statusText.textContent = s.state === 'building'
      ? `Building #${s.build}…`
      : `${label} #${s.build} · ${s.commit || '?'} · ${ago(s.time)}${s.state === 'ok' && !s.app_running ? ' · app not running' : ''}`;
    if (lastBuild !== null && s.build !== lastBuild && s.state === 'ok') screenEl.querySelector('canvas')?.focus();
    lastBuild = s.build;
  } catch {
    statusEl.dataset.state = 'offline';
    statusText.textContent = 'Demo offline';
  }
}
poll(); setInterval(poll, 2000);

// --- log panel -------------------------------------------------------------------
const panel = document.getElementById('logPanel');
const logBody = document.getElementById('logBody');
const logMeta = document.getElementById('logMeta');
const logRaw = document.getElementById('logRaw');
const logFollow = document.getElementById('logFollow');
let logName = null, logTimer = null, lastText = null;

const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function colorize(text) {
  return text.split('\n').map((line) => {
    const l = esc(line);
    if (/\berror\b|FAILED|fatal|undefined reference/i.test(line)) return `<span class="err">${l}</span>`;
    if (/\bwarning\b/i.test(line)) return `<span class="warn">${l}</span>`;
    if (/^\s*\||^\s+\^|note:/.test(line)) return `<span class="dim">${l}</span>`;
    return l;
  }).join('\n');
}
async function refreshLog() {
  if (!logName) return;
  try {
    const r = await fetch(`logs/${logName}.log`, { cache: 'no-store' });
    const text = r.ok ? await r.text() : `(no ${logName} log yet)`;
    logMeta.textContent = `${text.split('\n').length - 1} lines · ${new Date().toLocaleTimeString()}`;
    if (text === lastText) return;
    const atBottom = logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight < 40;
    lastText = text;
    logBody.innerHTML = text.trim() ? colorize(text) : `<span class="dim">(empty)</span>`;
    if (logFollow.checked && (atBottom || logBody.dataset.fresh)) logBody.scrollTop = logBody.scrollHeight;
    delete logBody.dataset.fresh;
  } catch {
    logMeta.textContent = 'offline';
  }
}
function openLog(name) {
  if (logName === name && !panel.hidden) return closeLog();
  logName = name; lastText = null; logBody.dataset.fresh = '1';
  panel.hidden = false;
  logRaw.href = `logs/${name}.log`;
  document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  document.querySelectorAll('[data-log]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.log === name)));
  logBody.innerHTML = '<span class="dim">Loading…</span>';
  clearInterval(logTimer);
  refreshLog(); logTimer = setInterval(refreshLog, 2000);
  rescale();
}
function closeLog() {
  panel.hidden = true; logName = null; clearInterval(logTimer);
  document.querySelectorAll('[data-log]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
  rescale();
}
// noVNC rescales on window resize; the panel changes the screen area without one.
function rescale() { requestAnimationFrame(() => window.dispatchEvent(new Event('resize'))); }
document.querySelectorAll('[data-log]').forEach((b) => b.addEventListener('click', () => openLog(b.dataset.log)));
document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => openLog(b.dataset.tab)));
document.getElementById('logClose').addEventListener('click', closeLog);
logFollow.addEventListener('change', () => { if (logFollow.checked) logBody.scrollTop = logBody.scrollHeight; });

// --- header buttons ------------------------------------------------------------
document.getElementById('fsBtn').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else { await document.documentElement.requestFullscreen(); await screen.orientation?.lock?.('landscape'); }
  } catch {}
});
const padToggle = document.getElementById('padToggle');
padToggle.addEventListener('click', () => {
  document.body.classList.toggle('show-pad');
  padToggle.textContent = document.body.classList.contains('show-pad') ? 'Hide pad' : 'Show pad';
});
</script>
</body>
</html>
